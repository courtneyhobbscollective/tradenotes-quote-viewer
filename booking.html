<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm booking</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#eef2f7; color:#111827; }
    .shell { max-width:520px; margin:0 auto; padding:28px 14px 48px; }
    .card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(15,23,42,.08); }
    .header { min-height:88px; padding:22px 20px; display:flex; align-items:center; justify-content:center; }
    .logo { max-width:160px; max-height:52px; object-fit:contain; display:block; }
    .body { padding:22px; }
    h1 { margin:0 0 8px; font-size:22px; }
    h2 { margin:0 0 8px; font-size:16px; }
    p { margin:0 0 10px; color:#4b5563; line-height:1.45; font-size:15px; }
    .slot { background:#f8fafc; border-radius:12px; padding:14px; margin:16px 0; }
    .slot strong { display:block; font-size:18px; color:#111827; margin-top:4px; }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
    button, a.btn { border:0; border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; }
    .btn-row > button, .btn-row > a.btn { flex:1; min-width:140px; }
    .yes { background:#16a34a; color:#fff; }
    .no { background:#fff; color:#b91c1c; border:1.5px solid #fecaca; }
    .go { width:100%; background:#111827; color:#fff; margin-top:10px; }
    .cal { background:#2563eb; color:#fff; }
    .cal-soft { background:#eff6ff; color:#1d4ed8; border:1.5px solid #bfdbfe; }
    button:disabled, a.btn[aria-disabled="true"] { opacity:.55; pointer-events:none; }
    .banner { margin-top:14px; border-radius:10px; padding:12px 14px; font-size:14px; font-weight:600; }
    .ok { background:#ecfdf5; color:#047857; }
    .bad { background:#fef2f2; color:#b91c1c; }
    .info { background:#eff6ff; color:#1d4ed8; }
    .err { padding:40px 20px; text-align:center; color:#6b7280; }
    .panel { display:none; margin-top:14px; background:#f8fafc; border-radius:12px; padding:14px; border:1px solid #e5e7eb; }
    .panel.open { display:block; }
    .panel label { display:block; font-size:12px; font-weight:700; color:#6b7280; margin:10px 0 6px; }
    .panel input { width:100%; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px; padding:12px; font-size:15px; font-family:inherit; background:#fff; }
    .alts { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
    .alt { text-align:left; background:#fff; border:1.5px solid #bfdbfe; color:#1d4ed8; padding:12px; border-radius:10px; font-weight:700; font-size:14px; }
    .alt.selected { background:#2563eb; border-color:#2563eb; color:#fff; }
    .hint { font-size:13px; color:#6b7280; margin:0 0 8px; }
    .cal-box { margin-top:16px; padding-top:14px; border-top:1px solid #e5e7eb; }
    .cal-box h2 { margin-bottom:6px; }
  </style>
</head>
<body>
  <div id="app" class="shell"><p class="err">Loading booking…</p></div>
  <script>
    const SUPABASE_URL = 'https://zqjbcvmiqapwribvebtn.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxamJjdm1pcWFwd3JpYnZlYnRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTcwMjksImV4cCI6MjA5Njc3MzAyOX0.uCu_9R3d_DeL2UgvjILXtQIlF45xt3QNGNtdRbxDLrg';

    function esc(v) {
      return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function sanitizeColor(v, fb) { return /^#([0-9a-fA-F]{6})$/.test((v||'').trim()) ? v.trim() : fb; }
    function tokenFromLocation() {
      return (new URLSearchParams(location.search).get('t') || '').trim();
    }
    function niceWhen(v) {
      const d = v ? new Date(v) : null;
      if (!d || Number.isNaN(d.getTime())) return 'the proposed time';
      return d.toLocaleString('en-GB', { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
    }
    function toLocalInputValue(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function toUtcStamp(d) {
      return d.getUTCFullYear() + pad2(d.getUTCMonth()+1) + pad2(d.getUTCDate()) + 'T' +
        pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
    }
    function icsEscape(text) {
      return String(text || '')
        .replace(/\\/g, '\\\\')
        .replace(/\n/g, '\\n')
        .replace(/,/g, '\\,')
        .replace(/;/g, '\\;');
    }
    function buildEventMeta(payload, whenIso) {
      const brand = payload.branding || {};
      const biz = brand.business_name || 'Your tradesperson';
      const start = new Date(whenIso);
      const mins = Number(brand.default_visit_duration_minutes) > 0
        ? Number(brand.default_visit_duration_minutes)
        : 120;
      const end = new Date(start.getTime() + mins * 60 * 1000);
      const title = biz + ' — booked work';
      const details = 'Confirmed booking with ' + biz +
        (payload.address ? (' at ' + payload.address) : '') +
        '. Reminder set for the day before.';
      return { biz, start, end, title, details, location: payload.address || '', mins };
    }
    function googleCalUrl(meta) {
      const dates = toUtcStamp(meta.start) + '/' + toUtcStamp(meta.end);
      return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
        '&text=' + encodeURIComponent(meta.title) +
        '&dates=' + encodeURIComponent(dates) +
        '&details=' + encodeURIComponent(meta.details) +
        '&location=' + encodeURIComponent(meta.location);
    }
    function buildIcs(meta) {
      const uid = 'booking-' + Date.now() + '@tradenotes';
      return [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//TradeNotes//Booking//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        'UID:' + uid,
        'DTSTAMP:' + toUtcStamp(new Date()),
        'DTSTART:' + toUtcStamp(meta.start),
        'DTEND:' + toUtcStamp(meta.end),
        'SUMMARY:' + icsEscape(meta.title),
        'DESCRIPTION:' + icsEscape(meta.details),
        meta.location ? ('LOCATION:' + icsEscape(meta.location)) : null,
        'BEGIN:VALARM',
        'TRIGGER:-P1D',
        'ACTION:DISPLAY',
        'DESCRIPTION:Reminder: work booked for tomorrow',
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].filter(Boolean).join('\r\n');
    }
    function downloadIcs(meta) {
      const blob = new Blob([buildIcs(meta)], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tradenotes-booking.ics';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }
    function calendarActionsHtml(payload, whenIso) {
      if (!whenIso) return '';
      const meta = buildEventMeta(payload, whenIso);
      const gUrl = googleCalUrl(meta);
      return (
        '<div class="cal-box">' +
          '<h2>Add to your calendar</h2>' +
          '<p class="hint">Includes a reminder the day before so you don’t forget.</p>' +
          '<div class="btn-row">' +
            '<a class="btn cal" id="add-google" href="' + esc(gUrl) + '" target="_blank" rel="noopener">Google Calendar</a>' +
            '<button type="button" class="cal-soft" id="add-ics">Apple / Outlook (.ics)</button>' +
          '</div>' +
        '</div>'
      );
    }
    async function rpc(name, body) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: {
          apikey: ANON_KEY,
          Authorization: 'Bearer ' + ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) throw new Error((data && data.message) || text || 'Request failed');
      return data;
    }

    async function main() {
      const app = document.getElementById('app');
      const token = tokenFromLocation();
      if (!token) {
        app.innerHTML = '<p class="err">Booking link missing.</p>';
        return;
      }
      try {
        const payload = await rpc('get_public_booking', { p_token: token });
        if (!payload) throw new Error('not found');
        const brand = payload.branding || {};
        const primary = sanitizeColor(brand.brand_primary_color, '#2563eb');
        const logoPath = brand.logo_path;
        const logoUrl = logoPath
          ? SUPABASE_URL + '/storage/v1/object/public/branding/' + logoPath
          : null;
        const biz = brand.business_name || 'Your tradesperson';
        const when = niceWhen(payload.proposed_scheduled_at || payload.scheduled_at);
        const alternatives = Array.isArray(payload.booking_alternatives)
          ? payload.booking_alternatives.filter(Boolean)
          : [];

        function wireCalendar(whenIso) {
          const icsBtn = document.getElementById('add-ics');
          if (!icsBtn || !whenIso) return;
          icsBtn.addEventListener('click', function () {
            downloadIcs(buildEventMeta(payload, whenIso));
          });
        }

        function render(status, extra) {
          const locked = status === 'confirmed' || status === 'declined';
          let actions = '';
          if (status === 'confirmed') {
            const confirmedAt = (extra && extra.scheduled_at) || payload.scheduled_at || payload.proposed_scheduled_at;
            actions = '<div class="banner ok">Thanks — this booking is confirmed' +
              (confirmedAt ? ' for <strong>' + esc(niceWhen(confirmedAt)) + '</strong>' : '') +
              '.</div>' +
              calendarActionsHtml(payload, confirmedAt);
          } else if (status === 'declined') {
            actions = '<div class="banner bad">Thanks for letting them know.' +
              (extra && extra.suggested_at
                ? ' We’ve passed on your suggested time (<strong>' + esc(niceWhen(extra.suggested_at)) + '</strong>).'
                : ' They’ll be in touch with another time.') +
              '</div>';
          } else {
            const altHtml = alternatives.length
              ? ('<p class="hint">These other times are free for them:</p><div class="alts" id="alts">' +
                  alternatives.map((iso) =>
                    '<button type="button" class="alt" data-iso="' + esc(iso) + '">' + esc(niceWhen(iso)) + '</button>'
                  ).join('') +
                '</div>')
              : '<p class="hint">No other free slots were listed — suggest a time that works for you below.</p>';

            actions =
              '<div class="btn-row">' +
                '<button type="button" class="yes" id="confirm">Yes, that works</button>' +
                '<button type="button" class="no" id="cant">Can’t make it</button>' +
              '</div>' +
              '<div id="reschedule" class="panel">' +
                '<h2>No problem — pick another time</h2>' +
                altHtml +
                '<label for="suggest">Or suggest a date &amp; time</label>' +
                '<input id="suggest" type="datetime-local" />' +
                '<button type="button" class="go" id="send-suggestion">Send my suggestion</button>' +
                '<p class="hint" style="margin-top:10px">Choosing one of their free slots books it straight away. A custom suggestion goes back to them to confirm.</p>' +
              '</div>' +
              '<div id="err" class="banner bad" style="display:none"></div>';
          }

          app.innerHTML =
            '<div class="card">' +
              '<div class="header" style="background:' + primary + '">' +
                (logoUrl
                  ? '<img class="logo" src="' + esc(logoUrl) + '" alt="" />'
                  : '<div style="color:#fff;font-weight:800;font-size:18px">' + esc(biz) + '</div>') +
              '</div>' +
              '<div class="body">' +
                '<h1>Confirm your booking</h1>' +
                '<p>' + esc(biz) + ' has suggested a time for your job' +
                  (payload.address ? ' at ' + esc(payload.address) : '') + '.</p>' +
                '<div class="slot"><span style="font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase">Proposed time</span><strong>' +
                  esc(when) + '</strong></div>' +
                actions +
              '</div>' +
            '</div>';

          if (status === 'confirmed') {
            const confirmedAt = (extra && extra.scheduled_at) || payload.scheduled_at || payload.proposed_scheduled_at;
            wireCalendar(confirmedAt);
            return;
          }
          if (locked) return;

          const err = document.getElementById('err');
          const showErr = (msg) => {
            if (!err) return;
            err.style.display = 'block';
            err.textContent = msg;
          };

          const submit = async (action, suggestedAt, btn) => {
            if (btn) btn.disabled = true;
            try {
              const body = { p_token: token, p_action: action };
              if (suggestedAt) body.p_suggested_at = suggestedAt;
              const result = await rpc('respond_to_public_booking', body);
              if (!result || result.ok === false) throw new Error((result && result.error) || 'Could not save');
              if (result.scheduled_at) payload.scheduled_at = result.scheduled_at;
              if (result.status === 'confirmed') payload.booking_status = 'confirmed';
              render(result.status, result);
            } catch (e) {
              showErr(e.message || 'Something went wrong');
              if (btn) btn.disabled = false;
            }
          };

          document.getElementById('confirm').addEventListener('click', (e) => {
            submit('confirm', null, e.currentTarget);
          });

          document.getElementById('cant').addEventListener('click', () => {
            const panel = document.getElementById('reschedule');
            if (panel) panel.classList.add('open');
            const suggest = document.getElementById('suggest');
            if (suggest && !suggest.value) {
              const base = new Date(payload.proposed_scheduled_at || Date.now());
              base.setDate(base.getDate() + 1);
              base.setHours(9, 0, 0, 0);
              suggest.value = toLocalInputValue(base.toISOString());
            }
          });

          document.querySelectorAll('.alt').forEach((btn) => {
            btn.addEventListener('click', () => {
              document.querySelectorAll('.alt').forEach((b) => b.classList.remove('selected'));
              btn.classList.add('selected');
              submit('choose', btn.getAttribute('data-iso'), btn);
            });
          });

          document.getElementById('send-suggestion').addEventListener('click', (e) => {
            const raw = (document.getElementById('suggest') || {}).value;
            if (!raw) {
              showErr('Please pick a suggested date and time.');
              return;
            }
            const iso = new Date(raw).toISOString();
            if (Number.isNaN(Date.parse(iso))) {
              showErr('That date doesn’t look valid.');
              return;
            }
            submit('decline', iso, e.currentTarget);
          });
        }

        render(payload.booking_status, payload);
      } catch (e) {
        app.innerHTML = '<p class="err">Booking not found.</p>';
      }
    }
    main();
  </script>
</body>
</html>
