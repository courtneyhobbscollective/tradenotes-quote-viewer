<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quote</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#eef2f7; color:#111827; }
    .shell { max-width:640px; margin:0 auto; padding:28px 14px 48px; }
    .card { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 10px 30px rgba(15,23,42,.08); }
    .header { min-height:112px; padding:28px 24px; display:flex; align-items:center; justify-content:center; }
    .logo { max-width:180px; max-height:64px; object-fit:contain; display:block; }
    .logo-fallback { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; }
    .body { padding:24px; }
    .identity { display:flex; justify-content:space-between; gap:16px; margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid #eef2f7; }
    .biz { margin:0; font-size:18px; font-weight:700; }
    .doc-tag { text-align:right; }
    .doc-tag .label { margin:0; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#6b7280; }
    .doc-tag .number { margin:4px 0 0; font-size:20px; font-weight:800; }
    .intro { display:flex; justify-content:space-between; gap:16px; margin-bottom:20px; }
    .intro h1 { margin:0 0 4px; font-size:22px; }
    .intro p, .meta { margin:0; color:#6b7280; font-size:14px; }
    .meta { text-align:right; font-size:13px; }
    .meta strong { display:block; color:#111827; font-size:14px; }
    .note { background:#f8fafc; border-radius:8px; padding:10px 12px; margin-bottom:16px; }
    .note .eye { color:#64748b; font-size:10px; font-weight:700; text-transform:uppercase; margin-bottom:3px; }
    .note p { margin:0; font-size:13px; line-height:1.45; font-weight:500; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    thead th { background:#f8fafc; color:#6b7280; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; text-align:left; padding:12px 8px; border-bottom:1px solid #e5e7eb; }
    tbody td { padding:14px 8px; border-bottom:1px solid #e5e7eb; font-size:14px; vertical-align:top; }
    .num { text-align:right; white-space:nowrap; color:#374151; }
    th.qty, td.qty { width:52px; } th.price, td.price { width:88px; } th.total, td.total { width:88px; }
    .totals { margin-top:14px; margin-left:auto; width:min(280px,100%); }
    .totals .row { display:flex; justify-content:space-between; padding:8px 0; font-size:14px; color:#4b5563; }
    .totals .row.total { margin-top:6px; padding-top:12px; border-top:2px solid #111827; color:#111827; font-size:18px; font-weight:800; }
    .footer { margin-top:18px; text-align:center; color:#94a3b8; font-size:12px; }
    .err { padding:40px 20px; text-align:center; color:#6b7280; }
    .actions { margin-top:22px; padding-top:18px; border-top:1px solid #eef2f7; }
    .actions h2 { margin:0 0 6px; font-size:16px; }
    .actions .hint { margin:0 0 14px; color:#6b7280; font-size:13px; line-height:1.4; }
    .btn-row { display:flex; flex-wrap:wrap; gap:10px; }
    button.btn { flex:1; min-width:110px; border:0; border-radius:10px; padding:14px 12px; font-size:15px; font-weight:700; cursor:pointer; }
    button.btn:disabled { opacity:.55; cursor:default; }
    .btn-accept { background:#16a34a; color:#fff; }
    .btn-reject { background:#fff; color:#b91c1c; border:1.5px solid #fecaca !important; }
    .btn-query { background:#fff; color:#2563eb; border:1.5px solid #bfdbfe !important; }
    .panel { display:none; margin-top:14px; background:#f8fafc; border-radius:12px; padding:14px; }
    .panel.open { display:block; }
    .panel label { display:block; font-size:12px; font-weight:700; color:#6b7280; margin-bottom:6px; }
    .panel textarea, .panel input { width:100%; box-sizing:border-box; border:1px solid #d1d5db; border-radius:8px; padding:12px; font-size:15px; margin-bottom:10px; font-family:inherit; }
    .panel textarea { min-height:96px; resize:vertical; }
    .panel .go { width:100%; background:#111827; color:#fff; border:0; border-radius:10px; padding:13px; font-weight:700; font-size:15px; cursor:pointer; }
    .panel .go:disabled { opacity:.55; }
    .status-banner { margin-top:16px; border-radius:10px; padding:12px 14px; font-size:14px; font-weight:600; }
    .status-banner.ok { background:#ecfdf5; color:#047857; }
    .status-banner.warn { background:#fff7ed; color:#c2410c; }
    .status-banner.bad { background:#fef2f2; color:#b91c1c; }
    .status-banner.info { background:#eff6ff; color:#1d4ed8; }
  </style>
</head>
<body>
  <div id="app" class="shell"><p class="err">Loading quote…</p></div>
  <script>
    const SUPABASE_URL = 'https://zqjbcvmiqapwribvebtn.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxamJjdm1pcWFwd3JpYnZlYnRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTcwMjksImV4cCI6MjA5Njc3MzAyOX0.uCu_9R3d_DeL2UgvjILXtQIlF45xt3QNGNtdRbxDLrg';

    function esc(v) {
      return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function pounds(p) { return '£' + (Number(p) / 100).toFixed(2); }
    function sanitizeColor(v, fb) { return /^#([0-9a-fA-F]{6})$/.test((v||'').trim()) ? v.trim() : fb; }
    function contrast(bg) {
      const h = sanitizeColor(bg,'#2563eb').slice(1);
      const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
      return ((0.299*r+0.587*g+0.114*b)/255) > 0.62 ? '#111827' : '#ffffff';
    }
    function docNum(n) { return (!n || n < 1) ? 'Q-····' : 'Q-' + String(n).padStart(4,'0'); }
    function docDate(v) {
      const d = v ? new Date(v) : new Date();
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    }
    function tokenFromLocation() {
      const q = new URLSearchParams(location.search).get('t');
      if (q && q.trim()) return q.trim();
      const hash = location.hash.replace(/^#/, '').trim();
      if (hash) return hash;
      const parts = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
      const last = parts[parts.length - 1];
      if (last && last !== 'index.html' && last !== 'q' && last !== 'tradenotes-quote-viewer' && !last.includes('.')) return last;
      return '';
    }

    async function rpc(name, body) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: {
          apikey: ANON_KEY,
          Authorization: 'Bearer ' + ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) {
        const err = (data && data.message) || text || 'Request failed';
        throw new Error(err);
      }
      return data;
    }

    function openWhatsApp(phone, message) {
      const text = encodeURIComponent(message || '');
      const url = phone
        ? 'https://wa.me/' + phone + '?text=' + text
        : 'https://wa.me/?text=' + text;
      window.location.href = url;
    }

    function statusBanner(status) {
      if (status === 'accepted') return '<div class="status-banner ok">You accepted this quote. Thanks — open WhatsApp to confirm with the tradesperson if it didn’t open automatically.</div>';
      if (status === 'declined') return '<div class="status-banner bad">You declined this quote.</div>';
      if (status === 'queried') return '<div class="status-banner info">Your question has been sent to the tradesperson.</div>';
      return '';
    }

    function actionsHtml(payload) {
      const locked = ['accepted', 'declined'].includes(payload.status);
      if (locked) return statusBanner(payload.status);
      if (payload.status === 'queried') {
        return statusBanner('queried') +
          '<div class="actions"><p class="hint">You can still accept or decline below once you’ve had a reply.</p>' +
          actionButtons() + responsePanels() + '</div>';
      }
      return '<div class="actions"><h2>What would you like to do?</h2>' +
        '<p class="hint">Accept, decline, or ask a question. We’ll draft a WhatsApp message for you to send.</p>' +
        actionButtons() + responsePanels() + '<div id="action-error" class="status-banner bad" style="display:none"></div></div>';
    }

    function actionButtons() {
      return '<div class="btn-row">' +
        '<button type="button" class="btn btn-accept" data-open="accept">Accept</button>' +
        '<button type="button" class="btn btn-reject" data-open="reject">Reject</button>' +
        '<button type="button" class="btn btn-query" data-open="query">Query</button>' +
      '</div>';
    }

    function responsePanels() {
      return '' +
        '<div id="panel-accept" class="panel">' +
          '<label for="accept-name">Your name (optional)</label>' +
          '<input id="accept-name" type="text" placeholder="e.g. Sam" />' +
          '<button type="button" class="go" data-submit="accept">Accept quote &amp; open WhatsApp</button>' +
        '</div>' +
        '<div id="panel-reject" class="panel">' +
          '<label for="reject-reason">Why are you declining?</label>' +
          '<textarea id="reject-reason" placeholder="e.g. Timing doesn’t work / gone with another quote"></textarea>' +
          '<button type="button" class="go" data-submit="reject">Decline &amp; open WhatsApp</button>' +
        '</div>' +
        '<div id="panel-query" class="panel">' +
          '<label for="query-message">Your question</label>' +
          '<textarea id="query-message" placeholder="What would you like to ask?"></textarea>' +
          '<button type="button" class="go" data-submit="query">Send query via WhatsApp</button>' +
        '</div>';
    }

    function wireActions(token, payload) {
      const root = document.getElementById('app');
      root.querySelectorAll('[data-open]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const which = btn.getAttribute('data-open');
          ['accept','reject','query'].forEach((k) => {
            const panel = document.getElementById('panel-' + k);
            if (panel) panel.classList.toggle('open', k === which);
          });
        });
      });

      root.querySelectorAll('[data-submit]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const action = btn.getAttribute('data-submit');
          const errEl = document.getElementById('action-error');
          if (errEl) errEl.style.display = 'none';
          let message = null;
          let customerName = null;
          if (action === 'accept') {
            customerName = (document.getElementById('accept-name') || {}).value || null;
          } else if (action === 'reject') {
            message = (document.getElementById('reject-reason') || {}).value || '';
            if (!message.trim()) {
              if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Please add a short reason for declining.'; }
              return;
            }
          } else if (action === 'query') {
            message = (document.getElementById('query-message') || {}).value || '';
            if (!message.trim()) {
              if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Please type your question.'; }
              return;
            }
          }

          btn.disabled = true;
          const prev = btn.textContent;
          btn.textContent = 'Sending…';
          try {
            const result = await rpc('respond_to_public_quote', {
              p_token: token,
              p_action: action,
              p_message: message,
              p_customer_name: customerName,
            });
            if (!result || result.ok === false) {
              throw new Error((result && result.error) || 'Could not save your response');
            }
            openWhatsApp(result.whatsapp_phone, result.drafted_message);
            // Re-render locked state if user returns
            payload.status = result.status;
            const actions = root.querySelector('.actions');
            if (actions) actions.outerHTML = actionsHtml(payload);
          } catch (e) {
            if (errEl) {
              errEl.style.display = 'block';
              errEl.textContent = e.message || 'Something went wrong. Please try again.';
            }
            btn.disabled = false;
            btn.textContent = prev;
          }
        });
      });
    }

    async function main() {
      const token = tokenFromLocation();
      const app = document.getElementById('app');
      if (!token) {
        app.innerHTML = '<p class="err">Missing quote link.</p>';
        return;
      }
      try {
        const payload = await rpc('get_public_quote', { p_token: token });
        if (!payload) throw new Error('not found');

        const header = sanitizeColor(payload.branding && payload.branding.brand_primary_color, '#2563eb');
        const ink = sanitizeColor(payload.branding && payload.branding.brand_secondary_color, '#111827');
        const onHeader = contrast(header);
        const businessName = (payload.branding && payload.branding.business_name && payload.branding.business_name.trim()) || 'Your business';
        const number = docNum(payload.quote_number);
        const issued = docDate(payload.sent_at || payload.created_at);
        const trade = payload.trade_type ? payload.trade_type.charAt(0).toUpperCase() + payload.trade_type.slice(1) : 'Trade';
        const logoPath = payload.branding && payload.branding.logo_path;
        const logoUrl = logoPath ? (SUPABASE_URL + '/storage/v1/object/public/branding/' + logoPath) : null;
        const logoHtml = logoUrl
          ? '<img class="logo" src="' + esc(logoUrl) + '" alt="" />'
          : '<div class="logo-fallback" style="color:' + onHeader + ';background:' + (onHeader === '#ffffff' ? 'rgba(255,255,255,.18)' : 'rgba(17,24,39,.12)') + '">' + esc(businessName.slice(0,1).toUpperCase()) + '</div>';
        const items = (payload.items || []).slice().sort((a,b) => a.sort_order - b.sort_order);
        const rows = items.map(item =>
          '<tr><td>' + esc(item.description) + '</td><td class="num qty">' + esc(item.quantity) + '</td><td class="num price">' + pounds(item.unit_price_pence) + '</td><td class="num total">' + pounds(item.line_total_pence) + '</td></tr>'
        ).join('');
        const noteHtml = payload.notes
          ? '<div class="note"><div class="eye">Please note</div><p>' + esc(payload.notes) + '</p></div>'
          : '';

        document.title = businessName + ' — Quote ' + number;

        app.innerHTML =
          '<div class="card">' +
            '<div class="header" style="background:' + header + '">' + logoHtml + '</div>' +
            '<div class="body" style="color:' + ink + '">' +
              '<div class="identity"><p class="biz">' + esc(businessName) + '</p>' +
                '<div class="doc-tag"><p class="label">Quote</p><p class="number">' + esc(number) + '</p></div></div>' +
              '<div class="intro"><div><h1>Quote for ' + esc(payload.customer_name || 'Customer') + '</h1><p>' + esc(trade) + ' · Prepared with care</p></div>' +
                '<div class="meta">' + (issued ? '<strong>' + esc(issued) + '</strong>' : '') + '<span>' + esc(number) + '</span></div></div>' +
              noteHtml +
              '<table><thead><tr><th>Item</th><th class="num qty">Qty</th><th class="num price">Price</th><th class="num total">Total</th></tr></thead><tbody>' + rows + '</tbody></table>' +
              '<div class="totals">' +
                '<div class="row"><span>Subtotal</span><span>' + pounds(payload.subtotal_pence) + '</span></div>' +
                '<div class="row"><span>VAT</span><span>' + pounds(payload.vat_pence) + '</span></div>' +
                '<div class="row total"><span>Total</span><span>' + pounds(payload.total_pence) + '</span></div>' +
              '</div>' +
              actionsHtml(payload) +
            '</div>' +
          '</div>' +
          '<p class="footer">' + esc(businessName) + ' · quote ' + esc(number) + '</p>';

        wireActions(token, payload);
      } catch (e) {
        app.innerHTML = '<p class="err">Quote not found.</p>';
      }
    }
    main();
  </script>
</body>
</html>
